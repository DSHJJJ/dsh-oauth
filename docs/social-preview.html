<!doctype html>
<meta charset="utf-8">
<style>
  html, body { margin: 0; }
  body {
    width: 1280px; height: 640px; overflow: hidden;
    background: radial-gradient(1200px 600px at 12% -10%, #1d2a4a 0%, #0d1017 55%, #0a0c11 100%);
    color: #e8ecf4;
    font-family: "SF Pro Display", -apple-system, "Helvetica Neue", "PingFang SC", sans-serif;
    display: flex; align-items: center; padding: 0 88px; box-sizing: border-box;
  }
  .grid { position: absolute; inset: 0; opacity: .35;
    background-image: linear-gradient(#ffffff08 1px, transparent 1px), linear-gradient(90deg, #ffffff08 1px, transparent 1px);
    background-size: 64px 64px; mask-image: radial-gradient(900px 500px at 20% 20%, #000 0%, transparent 75%); }
  .wrap { position: relative; display: flex; align-items: center; gap: 64px; width: 100%; }
  .icon { flex: 0 0 200px; height: 200px; border-radius: 44px; background: linear-gradient(160deg, #1b2233, #141a26);
    border: 1px solid #ffffff14; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 30px 60px #0008; }
  .icon img { width: 132px; height: 132px; }
  h1 { font-size: 76px; line-height: 1; margin: 0 0 18px; letter-spacing: -2px; font-weight: 700; }
  h1 span { color: #7fc4ff; }
  p.tag { font-size: 30px; line-height: 1.35; margin: 0 0 26px; color: #b7c2d6; max-width: 760px; letter-spacing: -.2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; max-width: 780px; }
  .chip { font-size: 19px; padding: 7px 15px; border-radius: 999px; color: #cfd9ea;
    background: #ffffff0d; border: 1px solid #ffffff18; }
  .url { margin-top: 26px; font-size: 22px; color: #7f8ea6; letter-spacing: .2px; }
</style>
<div class="grid"></div>
<div class="wrap">
  <div class="icon"><img src="../icon.svg" alt=""></div>
  <div>
    <h1>dsh<span>-oauth</span></h1>
    <p class="tag">OAuth sign-in for DeepSeek Harness — nine providers,<br>per-account allowlists, live configuration.</p>
    <div class="chips">
      <span class="chip">GitHub</span><span class="chip">Google</span><span class="chip">GitLab</span>
      <span class="chip">Gitee</span><span class="chip">Microsoft Entra</span><span class="chip">Discord</span>
      <span class="chip">Slack</span><span class="chip">Keycloak / OIDC</span><span class="chip">Feishu / Lark</span>
    </div>
    <div class="url">github.com/DSHJJJ/dsh-oauth</div>
  </div>
</div>
