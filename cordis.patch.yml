# dsh-oauth — bundle patch layer.
#
# Inserted after every shipped bundle layer, so `@deepseek-ai/dsh-client-connection`
# (and its `connection.authentication` registry) is already mounted when this row
# activates. Credentials and the allowlist live in the profile's own
# cordis.patch.yml under the `oauth-github` id — never in this file.
- insert:
    - id: oauth-github
      name: '@dshj/dsh-oauth'
