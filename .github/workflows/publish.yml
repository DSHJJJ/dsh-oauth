name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      # Staged publishing needs npm >= 11.15.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Ensure the committed bundle matches the build
        run: git diff --exit-code -- lib
      # The trusted publisher is stage-only: this queues the version.
      # A maintainer approves it on npmjs.com with 2FA before it goes live.
      - run: npm stage publish --provenance --access public
